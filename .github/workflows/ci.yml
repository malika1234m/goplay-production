name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build and integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goplay
          POSTGRES_PASSWORD: goplay
          POSTGRES_DB: goplay_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goplay" --health-interval 5s --health-timeout 5s --health-retries 10

    # Throwaway values for a throwaway database; nothing here reaches production
    env:
      DATABASE_URL: postgresql://goplay:goplay@localhost:5432/goplay_ci
      DIRECT_URL: postgresql://goplay:goplay@localhost:5432/goplay_ci
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
      # Optional: a dev Cloudinary account (repository secrets) enables the receipt-upload suite
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CI_CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CI_CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CI_CLOUDINARY_API_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Prisma 7 no longer generates the client on install or db push
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Database schema and seed data
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (errors fail the build)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start the app
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/api/app-config && exit 0; sleep 2; done
          echo "The app didn't start"; tail -50 server.log; exit 1

      - name: Integrity tests
        run: npx playwright test --project=integrity

      - name: Admin operations tests (needs the Cloudinary secrets)
        if: env.CLOUDINARY_API_SECRET != ''
        run: npx playwright test --project=admin-ops

      - name: Server log and test report on failure
        if: failure()
        run: tail -200 server.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
